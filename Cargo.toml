[workspace]
members = [
    "crates/hardata-domain",
    "crates/hardata-protocol",
    "crates/hardata-shared",
    "crates/hardata-app",
    "crates/hardata-bin",
    "crates/hardata-infra-agent",
    "crates/hardata-infra-http",
    "crates/hardata-infra-persistence",
    "crates/hardata-infra-transport",
    "crates/hardata-tool-cli",
    "crates/hardata-terminal",
    "crates/hardata-ui",
]
default-members = ["crates/hardata-bin"]
resolver = "2"

[workspace.dependencies]
# Workspace crates
hardata-domain = { path = "crates/hardata-domain" }
hardata-protocol = { path = "crates/hardata-protocol" }
hardata-shared = { path = "crates/hardata-shared" }
hardata-app = { path = "crates/hardata-app" }
hardata-infra-agent = { path = "crates/hardata-infra-agent" }
hardata-infra-http = { path = "crates/hardata-infra-http" }
hardata-infra-persistence = { path = "crates/hardata-infra-persistence" }
hardata-infra-transport = { path = "crates/hardata-infra-transport" }
hardata-tool-cli = { path = "crates/hardata-tool-cli" }
hardata-terminal = { path = "crates/hardata-terminal" }

# Runtime and application
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.7", features = ["ws", "macros"] }
bincode = "1.3"
blake3 = "1.5"
brotli = "3.4"
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive", "env"] }
crossbeam = "0.8"
dashmap = "6.1.0"
deadpool = { version = "0.12", features = ["rt_tokio_1"] }
fastcdc = "3.1"
filetime = "0.2"
futures = "0.3"
hex = "0.4"
libc = "0.2"
lz4 = "1.24"
mimalloc = { version = "0.1", default-features = false }
nix = { version = "0.30.1", features = ["fs", "zerocopy"] }
quinn = "0.11"
rayon = "1.11"
rcgen = "0.14.5"
regex = "1.10"
rust-embed = { version = "8.0", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sled = "0.34"
socket2 = "0.6"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.17"
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
x509-parser = "0.16"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

# Web frontend
# Keep the Rust crate and the checked-in/local `dx` CLI on the same release.
# Dioxus CLI rejects patch-level mismatches (for example dx 0.7.1 vs crate 0.7.10).
dioxus = { version = "=0.7.1", features = ["web"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "EventSource",
    "MessageEvent",
    "Storage",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
incremental = false
debug = false
debug-assertions = false

[profile.dev]
opt-level = 1

[profile.release.package.hardata-ui]
# Keep the generated Dioxus/WASM resources intact in release builds.
strip = false
